name: RE4 JPN Village Dual Drop v6 Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - agent/re4-jpn-village-dual-drop-v6
    paths:
      - RE4_JPN_VILLAGE_DUAL_DROP_V6.patch
      - .github/workflows/re4-jpn-village-dual-drop-v6-windows.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 120

    steps:
      - name: Checkout Dolphin with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Verify and apply RE4 village dual-drop v6 patch
        shell: pwsh
        run: |
          git apply --check RE4_JPN_VILLAGE_DUAL_DROP_V6.patch
          git apply RE4_JPN_VILLAGE_DUAL_DROP_V6.patch
          git diff --check

      - name: Configure and build Release x64
        shell: pwsh
        run: cmake --workflow --preset visualstudio-release-x64

      - name: Verify Dolphin executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build/release/x64/Binaries -Filter Dolphin.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'Dolphin.exe was not produced.' }
          Write-Host "Built executable: $($exe.FullName)"

      - name: Upload portable Dolphin build
        uses: actions/upload-artifact@v4
        with:
          name: Dolphin-RE4-JPN-Village-Dual-Drop-v6-Windows-x64
          path: build/release/x64/Binaries/**
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
