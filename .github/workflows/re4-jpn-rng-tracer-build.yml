name: Build RE4 JPN RNG Search v4

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - .github/workflows/re4-jpn-rng-tracer-build.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 120

    steps:
      - name: Checkout tracer branch with submodules
        uses: actions/checkout@v4
        with:
          ref: agent/re4-jpn-rng-tracer
          submodules: recursive
          fetch-depth: 1

      - name: Apply validated tracer v2 base
        shell: pwsh
        run: |
          git fetch --depth=1 origin 526f9813faadfb1c80739348853b34597d2c9636
          git show FETCH_HEAD:RE4_JPN_RNG_TRACER.patch | Set-Content -Encoding utf8NoBOM RE4_JPN_RNG_TRACER_V2_BASE.patch
          git apply --check RE4_JPN_RNG_TRACER_V2_BASE.patch
          git apply RE4_JPN_RNG_TRACER_V2_BASE.patch

      - name: Decode and verify internal RNG search v4 patch
        shell: pwsh
        run: |
          $b64 = (Get-Content -Raw RE4_V4_PATCH_GZ_B64.txt).Trim()
          [System.IO.File]::WriteAllBytes('RE4_JPN_RNG_SEARCH_V4.patch.gz', [Convert]::FromBase64String($b64))
          $input = [System.IO.File]::OpenRead('RE4_JPN_RNG_SEARCH_V4.patch.gz')
          $output = [System.IO.File]::Create('RE4_JPN_RNG_SEARCH_V4.patch')
          $gzip = [System.IO.Compression.GZipStream]::new($input, [System.IO.Compression.CompressionMode]::Decompress)
          try {
            $gzip.CopyTo($output)
          }
          finally {
            $gzip.Dispose()
            $output.Dispose()
            $input.Dispose()
          }
          $hash = (Get-FileHash RE4_JPN_RNG_SEARCH_V4.patch -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'd35df73408f9433a09cfc86f855130bf8294e2f95e705b702bbff1eac5b4075e') {
            throw "v4 patch SHA256 mismatch: $hash"
          }
          git apply --check RE4_JPN_RNG_SEARCH_V4.patch
          git apply RE4_JPN_RNG_SEARCH_V4.patch
          git diff --check

      - name: Configure and build Release x64
        shell: pwsh
        run: cmake --workflow --preset visualstudio-release-x64

      - name: Verify Dolphin executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build/release/x64/Binaries -Filter Dolphin.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'Dolphin.exe was not produced.' }
          Write-Host "Built executable: $($exe.FullName)"

      - name: Upload portable Dolphin v4 search build
        uses: actions/upload-artifact@v4
        with:
          name: Dolphin-RE4-JPN-RNG-Search-v4-Windows-x64
          path: build/release/x64/Binaries/**
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
