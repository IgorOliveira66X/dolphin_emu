name: RE4 JPN Passive Drop Monitor v0.3 Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - agent/re4-drop-monitor-v03
    paths:
      - Source/Core/Core/RE4RNGTrace.cpp
      - Source/Core/Core/RE4DropResult.h
      - RE4DropSearch.ini
      - .github/workflows/re4-drop-monitor-v03.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 120
    steps:
      - name: Checkout Dolphin with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Verify source tree
        shell: pwsh
        run: git diff --check

      - name: Configure and build Release x64
        shell: pwsh
        run: cmake --workflow --preset visualstudio-release-x64

      - name: Assemble passive portable Dolphin
        shell: pwsh
        run: |
          $binaries = Resolve-Path build/release/x64/Binaries
          $exe = Join-Path $binaries 'Dolphin.exe'
          if (-not (Test-Path $exe)) { throw 'Dolphin.exe was not produced.' }
          Copy-Item RE4DropSearch.ini (Join-Path $binaries 'RE4DropSearch.ini') -Force
          New-Item (Join-Path $binaries 'portable.txt') -ItemType File -Force | Out-Null
          Select-String -Path (Join-Path $binaries 'RE4DropSearch.ini') -Pattern '^Enabled = False$' | Select-Object -First 1
          Get-FileHash $exe -Algorithm SHA256 | Format-List

      - name: Upload complete portable Dolphin build
        uses: actions/upload-artifact@v4
        with:
          name: Dolphin-RE4-JPN-Passive-Drop-Monitor-v0.3-Windows-x64
          path: build/release/x64/Binaries/**
          if-no-files-found: error
          compression-level: 6
          retention-days: 90
